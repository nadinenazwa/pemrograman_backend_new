services:
  postgres:
    image: postgres:16-alpine
    container_name: praktikum_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: praktikum_backend
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d praktikum_backend"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  mongo:
    image: mongo:7.0
    container_name: praktikum_mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' || exit 1"]
      interval: 20s
      timeout: 60s
      retries: 5
      start_period: 40s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: praktikum_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  api:
    image: praktikum-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: praktikum_api
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      APP_PORT: "3000"
      APP_ROLE: "api"
      SWAGGER_ENABLED: "true"
      DATABASE_URL: "postgres://postgres:${DB_PASSWORD}@postgres:5432/praktikum_backend?sslmode=disable"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DATABASE: "praktikum_backend"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi di .env}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - applogs:/app/logs
    networks:
      - app-network

  worker:
    image: praktikum-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: praktikum_worker
    restart: unless-stopped
    command: ["-role=worker"]
    environment:
      APP_PORT: "3000"
      APP_ROLE: "worker"
      DATABASE_URL: "postgres://postgres:${DB_PASSWORD}@postgres:5432/praktikum_backend?sslmode=disable"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DATABASE: "praktikum_backend"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi di .env}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - applogs:/app/logs
    networks:
      - app-network

volumes:
  pgdata:
  mongodata:
  redisdata:
  applogs:

networks:
  app-network:
    driver: bridge
